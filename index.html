
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Agness | My Inamorata</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    background: #100d16;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
    overflow-x: hidden;
}

.container {
    max-width: 500px;
    width: 100%;
    padding: 55px 25px;
    border: 1px solid #b58a6a;
    border-radius: 30px;
    background: linear-gradient(145deg,#241727,#100d16);
    box-shadow: 0 0 40px #b58a6a22;
    position: relative;
    z-index: 1;
}

.small-title {
    color: #d6ad8c;
    letter-spacing: 5px;
    font-size: 11px;
    margin-bottom: 75px;
}

.heart {
    font-size: 65px;
    color: #e8a2b2;
    margin-bottom: 30px;
    animation: heartbeat 1.5s infinite;
}

h1 {
    font-size: 48px;
    font-weight: normal;
    margin-bottom: 12px;
}

.subtitle {
    color: #d6ad8c;
    font-style: italic;
    font-size: 22px;
    margin-bottom: 55px;
}

.message {
    color: #ded5df;
    line-height: 1.9;
    font-size: 17px;
    margin-bottom: 55px;
}

button {
    background: #c69b83;
    color: #170f17;
    border: none;
    padding: 19px 32px;
    border-radius: 40px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:active {
    transform: scale(0.94);
}

.footer {
    margin-top: 55px;
    color: #a99aa8;
    font-size: 11px;
    letter-spacing: 2px;
}

@keyframes heartbeat {
    0%,100% {transform:scale(1);}
    50% {transform:scale(1.2);}
}

.sparkle {
    position: fixed;
    color: #e8a2b2;
    opacity: 0.5;
    animation: float 6s linear forwards;
    pointer-events: none;
    z-index: 0;
}

@keyframes float {
    from {transform:translateY(100vh);opacity:0;}
    to {transform:translateY(-10vh);opacity:0.8;}
}

/* Surprise transition */

#transition {
    position: fixed;
    inset: 0;
    background: #100d16;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
}

#transition.active {
    display: flex;
    animation: fadeIn 0.8s ease;
}

.transition-heart {
    font-size: 90px;
    color: #f0a5ba;
    animation: bigHeart 1s infinite;
    text-shadow: 0 0 35px #f0a5ba;
}

.transition-text {
    color: #e8c6b2;
    margin-top: 35px;
    font-size: 19px;
    font-style: italic;
    letter-spacing: 2px;
    animation: fadeText 2s infinite;
}

.flying-heart {
    position: absolute;
    bottom: -50px;
    color: #f0a5ba;
    animation: rise 3s linear forwards;
    pointer-events: none;
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

@keyframes bigHeart {
    0%,100% {transform:scale(1);}
    50% {transform:scale(1.3);}
}

@keyframes fadeText {
    0%,100% {opacity:0.5;}
    50% {opacity:1;}
}

@keyframes rise {
    to {
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

    <p class="small-title">A LITTLE WORLD FOR YOU</p>

    <div class="heart">♥</div>

    <h1>Agness</h1>

    <p class="subtitle">My Inamorata</p>

    <p class="message">
        Some people make ordinary moments
        feel extraordinary.

        And somehow, you have become
        one of my favourite parts of life.
    </p>

    <button onclick="showSurprise()">
        Open Your Surprise ♥
    </button>

    <p class="footer">
        MADE WITH LOVE · JUST FOR YOU
    </p>

</div>

<div id="transition">
    <div class="transition-heart">♥</div>
    <p class="transition-text">
        A little surprise, from my heart to yours...
    </p>
</div>

<script>
function showSurprise() {
    const screen = document.getElementById("transition");

    screen.classList.add("active");

    for (let i = 0; i < 35; i++) {
        setTimeout(() => {
            const heart = document.createElement("div");

            heart.className = "flying-heart";
            heart.innerHTML = Math.random() > 0.5 ? "♥" : "♡";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (15 + Math.random() * 35) + "px";
            heart.style.animationDuration = (2 + Math.random() * 2) + "s";

            screen.appendChild(heart);

            setTimeout(() => heart.remove(), 4500);
        }, i * 65);
    }

    setTimeout(() => {
        window.location.href = "surprise.html";
    }, 3500);
}

function createSparkle() {
    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";
    sparkle.innerHTML = "✦";
    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.animationDuration = (4 + Math.random() * 5) + "s";

    document.body.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 9000);
}

setInterval(createSparkle, 700);
</script>

</body>
</html>
